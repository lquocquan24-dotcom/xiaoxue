<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“智领未来”小队长线上选拔</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        /* 添加加载动画效果 */
        .loading { cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-xl overflow-hidden">
        <div class="bg-blue-800 p-8 text-white text-center">
            <h1 class="text-2xl font-bold">“智领未来”社会实践小队长选拔系统</h1>
            <p class="mt-2 opacity-90 italic">—— 追寻AI产业前沿，稳步通过结项评审 ——</p >
        </div>

        <div id="success-message" class="hidden p-20 text-center">
            <h2 class="text-3xl font-bold text-blue-800 mb-4">提交成功！</h2>
            <p class="text-xl text-gray-600">感谢您的填写，请耐心等待结果。</p >
            <div class="mt-8 text-gray-400">您可以关闭此页面了</div>
        </div>

        <form id="selection-form" action="https://formspree.io/f/mojvnkdp" method="POST" class="p-8 space-y-10">
            
            <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block font-bold text-gray-700 mb-2">您的姓名：</label>
                    <input type="text" name="user_name" required class="w-full p-3 border-2 border-gray-100 rounded-lg focus:border-blue-500 focus:outline-none" placeholder="请输入姓名">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-2">您的学号：</label>
                    <input type="text" name="student_id" required class="w-full p-3 border-2 border-gray-100 rounded-lg focus:border-blue-500 focus:outline-none" placeholder="请输入学号">
                </div>
            </section>

            <hr class="border-gray-100">

            <section>
                <h2 class="text-xl font-bold text-blue-800 border-b-2 border-blue-100 pb-2 mb-6">流程一：个人素质与潜力自荐</h2>
                <div>
                    <label class="block font-medium text-gray-700 mb-2">1. 综合能力陈述（请结合组织协调、文档撰写、视频剪辑、责任心、媒体投稿等方面展开）：</label>
                    <textarea name="intro" maxlength="1000" required class="w-full h-44 p-4 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="请详细陈述相关经验..."></textarea>
                    <p class="mt-2 text-sm text-gray-400 italic text-right">※ 作品集非硬性要求，如有请另发至：3109616991@qq.com</p >
                </div>
            </section>

            <section>
                <h2 class="text-xl font-bold text-blue-800 border-b-2 border-blue-100 pb-2 mb-6">流程二：特定场景应对（必答）</h2>
                <div class="space-y-8 text-sm">
                    
                    <div>
                        <label class="block font-bold text-gray-700 text-base mb-2">问题 A：若组内无专业技术人员，如何统筹完成照片占比少于 20% 的高质量结项视频？</label>
                        <textarea name="q_video" maxlength="1000" required class="w-full h-32 p-4 border rounded-lg" placeholder="注：学校要求视频比例16:9，分辨率不低于1080P"></textarea>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-base mb-2">问题 B：若因成员突发缺席导致地标合影人数不符（涉及结项资格），你将如何应对？</label>
                        <textarea name="q_photo" maxlength="1000" required class="w-full h-32 p-4 border rounded-lg" placeholder="注：合影人数与名单不符将无法结项"></textarea>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-base mb-2">问题 C：若成员提交的报告 AIGC 检测率超过 20% 且拒绝修改，作为队长你如何化解？</label>
                        <textarea name="q_aigc" maxlength="1000" required class="w-full h-32 p-4 border rounded-lg" placeholder="注：AIGC检测率超过20%将取消结项资格"></textarea>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-base mb-2">问题 D：社会实践中若队员之间因工作分配或意见不合产生冲突，你将如何协调以保证任务进度？</label>
                        <textarea name="q_conflict" maxlength="1000" required class="w-full h-32 p-4 border rounded-lg" placeholder="请描述你的冲突管理与团队沟通策略..."></textarea>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-base mb-2 text-red-700">问题 E：请分析并写出所有可能影响“顺利结项”的相关情况，并提出你的规避策略：</label>
                        <textarea name="q_conclusion_risks" maxlength="1000" required class="w-full h-40 p-4 border-2 border-red-50 rounded-lg focus:ring-2 focus:ring-red-200" placeholder="请结合学校《成果审核办法》，分析材料、查重、合影等风险因素..."></textarea>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 text-base mb-2">问题 F：你计划如何建立小组内的安全反馈机制，确保调研期间全员安全且信息通畅？</label>
                        <textarea name="q_safety" maxlength="1000" required class="w-full h-32 p-4 border rounded-lg"></textarea>
                    </div>

                </div>
            </section>

            <section>
                <h2 class="text-xl font-bold text-blue-800 border-b-2 border-blue-100 pb-2 mb-6">流程三：自主风险预判</h2>
                <div>
                    <label class="block font-medium text-gray-700 mb-2">请自行推演一个本调研中可能出现的问题并给出方案：</label>
                    <textarea name="q_risk" maxlength="1000" required class="w-full h-40 p-4 border rounded-lg" placeholder="发现问题并解决问题的深度将作为选拔的核心标准..."></textarea>
                </div>
            </section>

            <div class="text-center pt-4">
                <button type="submit" id="submit-btn" class="bg-blue-800 text-white px-16 py-4 rounded-full font-bold shadow-2xl hover:bg-blue-900 transition-all transform hover:scale-105">
                    确认并提交申请单
                </button>
                <p class="mt-6 text-gray-400 text-xs">© 2026 大连理工大学 AIGC 社团寒假社会实践组</p >
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('selection-form');
        const submitBtn = document.getElementById('submit-btn');
        const successMsg = document.getElementById('success-message');

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // 阻止默认跳转逻辑
            
            submitBtn.innerText = "提交中...";
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // 隐藏表单，显示感谢信息
                    form.classList.add('hidden');
                    successMsg.classList.remove('hidden');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert("提交出现问题，请检查网络后重试。");
                    resetBtn();
                }
            } catch (error) {
                alert("网络错误，请稍后再试。");
                resetBtn();
            }
        });

        function resetBtn() {
            submitBtn.innerText = "确认并提交申请单";
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        }
    </script>
</body>
</html>
